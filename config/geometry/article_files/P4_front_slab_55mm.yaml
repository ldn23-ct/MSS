schema:
  name: layered_backscatter_phantom_model
  version: v01_cm_scale_depth_phantom
  format: yaml
metadata:
  model_name: P4_front_slab_55mm
  model_version: v01
  generated_at_utc: '2026-08-24'
  scope: P4 first-scatter front-region reference geometry
  description: Uniform 1000x1000x55 mm PMMA front slab covering 0 <= z < 55 mm
  coordinate_note: Origin is the center of the slab front surface; PMMA occupies positive z.
  reference:
    type: uniform_pmma_front_slab
    matched_phantom: P4
    matched_profile: P001
    matched_slit: S4
    thickness_mm: 55.0
    z_range_mm:
    - 0.0
    - 55.0
  defect: null
  normalized_for_mss_vehicle_roi: true
  source_root_component: PMMAFrontSlab
units:
  length: mm
  density: g/cm3
  mass_fraction: fraction
  size_semantics: full_length_not_half_length
coordinate_system:
  x: lateral scan direction on slab front surface
  y: vertical scan direction on slab front surface
  z: depth direction; z=0 is slab front surface; +z points into slab
  origin:
    definition: center of slab front surface
    position_mm:
    - 0.0
    - 0.0
    - 0.0
  source_detector_side: z < 0
  phantom_side: z >= 0
roi:
  name: VehicleROI
  bounds_mm:
    x:
    - -500.0
    - 500.0
    y:
    - -500.0
    - 500.0
    z:
    - 0.0
    - 55.0
  center_mm:
  - 0.0
  - 0.0
  - 27.5
  size_mm:
  - 1000.0
  - 1000.0
  - 55.0
  material: G4_PLEXIGLASS
  region_id: pmma_bulk
geant4_placement_rules:
  solid: G4Box for each listed component
  box_half_length_mm: size_mm * 0.5
  global_center_semantics: component center is expressed in phantom coordinate system
  placement_center_in_host_mm: component_center_mm - host_center_mm; root component is placed directly in World
  touching_surfaces: allowed in conceptual model
  optional_engineering_gap_mm: 0.01
materials:
  G4_AIR:
    type: NIST
    built_in: true
    semantic: air / void
  G4_PLEXIGLASS:
    type: NIST
    built_in: true
    semantic: PMMA slab material
  G4_Fe:
    type: NIST
    built_in: true
    semantic: steel / metal layer proxy
  G4_POLYPROPYLENE:
    type: NIST
    built_in: true
    semantic: low-Z plastic trim layer proxy
  G4_POLYETHYLENE:
    type: NIST
    built_in: true
    semantic: optional low-Z organic target proxy
  Vehicle_Flour:
    type: custom
    built_in: false
    density_g_cm3: 0.6
    elements_by_mass_fraction:
      C: 0.444
      H: 0.062
      O: 0.494
    semantic: flour / low-Z powder target proxy; approximate composition for simulation comparison
model_modes:
  normal:
    rule: uniform PMMA front slab with no insert or defect
  abnormal:
    selected_target_component: null
    rule: not used for the uniform front-slab reference
    default_abnormal_material: null
    target_region_id: null
    recommended_single_target_components: []
    alternative_abnormal_materials: []
regions:
  detailed_region_ids:
  - pmma_bulk
  - air_void
  - target
  - none
  - other
  region_groups:
    phantom_body:
    - pmma_bulk
    defect:
    - air_void
    - target
components:
- name: VehicleROI
  host: World
  shape: box
  center_mm:
  - 0.0
  - 0.0
  - 27.5
  size_mm:
  - 1000.0
  - 1000.0
  - 55.0
  material: G4_PLEXIGLASS
  region_id: pmma_bulk
  is_insert: false
  role: uniform_pmma_front_slab
  half_size_mm:
  - 500.0
  - 500.0
  - 27.5
  aabb_mm:
    x:
    - -500.0
    - 500.0
    y:
    - -500.0
    - 500.0
    z:
    - 0.0
    - 55.0
  placement_center_in_host_mm:
  - 0.0
  - 0.0
  - 27.5
validation:
  aabb_overlap_check:
    method: positive-volume overlap among sibling components; touching surfaces are allowed
    status: not_applicable_single_component
  required_host_containment_checks:
  - the root PMMA slab is fully contained in World
  - the component aabb_mm values are consistent with center_mm and size_mm
  - no insert component is present
